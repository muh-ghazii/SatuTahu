# Netlify mendeteksi Next.js otomatis dan memakai adapter OpenNext (dukungan penuh Cache Components).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Variabel NEXT_PUBLIC_* memang publik (disisipkan ke JavaScript browser), bukan rahasia.
  # Kecualikan dari secrets scanning; scanning tetap aktif untuk variabel lain.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

# Header keamanan dasar untuk semua halaman.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
